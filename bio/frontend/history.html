<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance History — GeoBio Auth</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d1117">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>

  <header class="top-header">
    <a href="/" class="brand">
      <div class="brand-icon">📜</div>
      <span>Attendance History</span>
    </a>
    <div id="topUserBadge" class="user-badge">Loading...</div>
  </header>

  <main class="app-container">
    <div id="alertContainer"></div>

    <div class="card">
      <div class="card-title">Your Biometric Attendance Log</div>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 16px;">
        Chronological record of your physical authentication attempts.
      </p>

      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Date & Time</th>
              <th>Distance</th>
              <th>Accuracy</th>
              <th>Result</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr>
              <td colspan="4" style="text-align: center; color: var(--text-dim); padding: 20px;">
                Loading attendance history...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="/index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="/authenticate.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>

      <span>Authenticate</span>
    </a>
    <a href="/dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="/history.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 00-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 117 7 7.07 7.07 0 01-6-3.44l-1.42 1.42A8.95 8.95 0 0013 21a9 9 0 000-18zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8z"/></svg>
      <span>History</span>
    </a>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await API.getUserHistory();
        const tbody = document.getElementById('historyTableBody');

        if (!res.success || !res.logs || res.logs.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="4" style="text-align: center; color: var(--text-dim); padding: 20px;">
                No attendance records found yet.
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = res.logs.map(log => {
          let badgeClass = 'badge-danger';
          if (log.result === 'SUCCESS') badgeClass = 'badge-success';
          else if (log.result === 'OUTSIDE_RADIUS') badgeClass = 'badge-warning';

          return `
            <tr>
              <td>${new Date(log.timestamp).toLocaleString()}</td>
              <td>${log.calculated_distance !== null ? log.calculated_distance + 'm' : '--'}</td>
              <td>${log.gps_accuracy !== null ? log.gps_accuracy + 'm' : '--'}</td>
              <td><span class="badge ${badgeClass}">${log.result}</span></td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        App.showAlert('Failed to load history.', 'danger');
      }
    });
  </script>
</body>
</html>
